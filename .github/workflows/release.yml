name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Assembling release assets by hand is the most error-prone step in shipping
  # this project: copy the right store path, rename it, checksum it, upload it.
  # A slip there publishes the wrong bytes under a right-looking checksum, and
  # nothing downstream would notice. This does it the same way every time.
  # ---------------------------------------------------------------------------
  assets:
    name: build ${{ matrix.arch }} static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-static-${{ matrix.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-static-${{ matrix.arch }}-
          gc-max-store-size-linux: 4G

      - name: Resolve the version
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          src=$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' src/cli.cpp)
          # Refuse to publish a binary whose --version disagrees with its filename.
          [ "$version" = "$src" ] || { echo "::error::tag $tag != source version $src"; exit 1; }
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: nix build .#holesail-${{ matrix.arch }}-static

      - name: Verify and stage
        run: |
          bin=result/bin/holesail
          case "${{ matrix.arch }}" in
            x86_64)  want='x86-64' ;;
            aarch64) want='ARM aarch64' ;;
          esac
          file "$bin"
          file "$bin" | grep -q "$want"             || { echo "::error::wrong machine"; exit 1; }
          file "$bin" | grep -q 'statically linked' || { echo "::error::not static"; exit 1; }
          if ldd "$bin" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::binary has dynamic dependencies"; exit 1
          fi

          mkdir -p dist
          out="dist/holesail-${{ steps.v.outputs.tag }}-${{ matrix.arch }}-linux-static"
          install -m755 "$bin" "$out"

          # The native binary must actually run and report the tagged version.
          # The cross one cannot be executed here — `file` above is all we get.
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            got=$("$out" --version)
            [ "$got" = "${{ steps.v.outputs.version }}" ] \
              || { echo "::error::binary reports $got, expected ${{ steps.v.outputs.version }}"; exit 1; }
          fi

          ( cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )
          cat "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: static-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # The Android binary cannot come from the `assets` matrix above: it is not a
  # nix build and not static — it links bionic dynamically, which is the whole
  # point (a static musl binary is killed by Android's seccomp filter). Same
  # staging contract though: one binary plus its .sha256, so the publish job
  # picks it up without knowing anything about Android.
  # ---------------------------------------------------------------------------
  android:
    name: build android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          src=$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' src/cli.cpp)
          [ "$version" = "$src" ] || { echo "::error::tag $tag != source version $src"; exit 1; }
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install autotools (libsodium's android script needs them)
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool ninja-build

      - name: Build
        run: ./scripts/build-android.sh

      - name: Verify and stage
        run: |
          bin=build-android/holesail
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64'     || { echo "::error::wrong machine"; exit 1; }
          file "$bin" | grep -q 'pie executable'  || { echo "::error::not PIE"; exit 1; }
          # `grep stripped` would also match "not stripped" — invert it.
          if file "$bin" | grep -q 'not stripped'; then
            echo "::error::not stripped"; exit 1
          fi
          # Only stock bionic may be NEEDED. libc++_shared.so is not present on
          # a device, so linking it would fail at exec time and nowhere earlier.
          # Matched with `case`, not `grep -v`: an inverted grep here is easy to
          # write so that it can never fire, and the failure mode is a check
          # that silently passes forever.
          readelf=$(echo "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          needed=$("$readelf" -d "$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort -u)
          echo "NEEDED: $needed"
          [ -n "$needed" ] || { echo "::error::no NEEDED entries — readelf parse failed"; exit 1; }
          for lib in $needed; do
            case "$lib" in
              libm.so|libdl.so|libc.so) ;;
              *) echo "::error::unexpected shared library dependency: $lib"; exit 1 ;;
            esac
          done

          mkdir -p dist
          out="dist/holesail-${{ steps.v.outputs.tag }}-aarch64-android"
          install -m755 "$bin" "$out"
          ( cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )
          cat "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: static-android
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [assets, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      - name: Assemble SHA256SUMS
        id: sums
        run: |
          cd staged
          # One combined file, in a stable order, from the per-arch sums the
          # build jobs produced — never recomputed here, so what is published
          # is the checksum the job that built the binary actually saw.
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt
          ls -l

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running on an existing tag replaces the assets but leaves the
            # notes alone — they are hand-written and must not be clobbered.
            gh release upload "$tag" staged/* --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              staged/*
          fi
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size)B"'
